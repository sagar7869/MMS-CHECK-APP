<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarSquare Rafter Finder</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0056b3; margin-bottom: 25px; }
        
        /* Search Box & Suggestions CSS */
        .search-container { position: relative; width: 70%; margin: 0 auto 20px auto; }
        .search-container input { width: 100%; padding: 12px 18px; font-size: 18px; border: 2px solid #0056b3; border-radius: 6px; outline: none; text-transform: uppercase; box-sizing: border-box; }
        
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
        }
        .suggestion-item:hover {
            background-color: #eef2f7;
            color: #0056b3;
            font-weight: bold;
        }

        .result-section { display: none; margin-top: 20px; }
        .details-card { background: #eef2f7; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; border-left: 5px solid #0056b3; }
        .details-card h3 { margin-top: 0; color: #0056b3; }
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; font-size: 16px; }
        .pdf-viewer-container { width: 100%; height: 550px; border: 1px solid #ccc; border-radius: 6px; background: #eee; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 6px; }
        .error-msg { color: red; text-align: center; font-weight: bold; margin-top: 15px; display: none; }
        
        @media(max-width: 600px) { 
            .details-grid { grid-template-columns: 100%; } 
            .search-container { width: 100%; } 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔍 SolarSquare Rafter Quick Finder</h2>
    
    <div class="search-container">
        <input type="text" id="codeInput" placeholder="Enter Code or Number (e.g. 0101) & Press Enter..." oninput="showSuggestions()" onkeypress="handleSearchEnter(event)" autocomplete="off">
        <div id="suggestionsList" class="suggestions-list"></div>
    </div>
    
    <div id="errorMsg" class="error-msg">Item Code not found in database! Please check and try again.</div>

    <div id="resultSection" class="result-section">
        <div class="details-card">
            <h3 id="resTitle"></h3>
            <div class="details-grid">
                <div><strong>Item Code:</strong> <span id="resCode"></span></div>
                <div><strong>Length:</strong> <span id="resLength"></span></div>
                <div><strong>Thickness:</strong> <span id="resThick"></span></div>
                <div><strong>Section Size:</strong> <span id="resSize"></span></div>
            </div>
        </div>

        <h3>📄 Drawing PDF Preview</h3>
        <div class="pdf-viewer-container">
            <iframe id="pdfFrame" src=""></iframe>
        </div>
    </div>
</div>

<script>
    function getDrivePreviewUrl(url) {
        if (!url) return "";
        return url.replace(/\/view\?.*$/, "/preview");
    }

    const raftersDB = {
        "RAFT-0101": { code: "RAFT-0101", desc: "R1PL - Rafter 1P Light (Mono 540)", size: "80x40x10 mm", thick: "1.2 mm", length: "1611 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1-w0BCIHwoz9eF-XGNVQVqnq6QI1RYkvq/view?usp=drive_link") },
        "RAFT-0102": { code: "RAFT-0102", desc: "R1PM - Rafter 1P Medium (Mono 540)", size: "80x40x10 mm", thick: "1.5 mm", length: "1611 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1D9QSwNur_NvDNqqWB90KyFuJ-8dEx52k/view?usp=drive_link") },
        "RAFT-0103": { code: "RAFT-0103", desc: "R1PH - Rafter 1P Heavy (Mono 540)", size: "80x40x10 mm", thick: "2.0 mm", length: "1611 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/19I1GcLM-ttewy3iDNiKDw1fwLJDBv-Qg/view?usp=drive_link") },
        "RAFT-0201": { code: "RAFT-0201", desc: "R2PL - Rafter 2P Light (Mono 540)", size: "90x45x15 mm", thick: "1.2 mm", length: "3910 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1SSkArR29WG6pe8UuYFi9MtZ5q_5ZhnTn/view?usp=drive_link") },
        "RAFT-0202": { code: "RAFT-0202", desc: "R2PM - Rafter 2P Medium (Mono 540)", size: "100x45x15 mm", thick: "1.5 mm", length: "3910 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1MVvUIEkqZDu6E8JOUZbeTjJVg5SuJrDy/view?usp=drive_link") },
        "RAFT-0203": { code: "RAFT-0203", desc: "R2PH - Rafter 2P Heavy (Mono 540)", size: "130x45x15 mm", thick: "2.0 mm", length: "3910 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1rVSmv2g0QW3khxhrSYn1dMjRISh2z482/view?usp=drive_link") },
        "RAFT-0311": { code: "RAFT-0311", desc: "R3PTL - Rafter 3P Top Light (Mono 540)", size: "125x55x15 mm", thick: "1.5 mm", length: "3000 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1xp0Emmm-xqY5YScRc2hE97R8hhmYaRoK/view?usp=drive_link") },
        "RAFT-0312": { code: "RAFT-0312", desc: "R3PTM - Rafter 3P Top Medium (Mono 540)", size: "130x55x15 mm", thick: "2.0 mm", length: "3000 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1QQAeSb4smErtRnIyK7hxZhqduk9lqXRq/view?usp=drive_link") },
        "RAFT-0313": { code: "RAFT-0313", desc: "R3PTH - Rafter 3P Top Heavy (Mono 540)", size: "180x55x15 mm", thick: "2.0 mm", length: "3000 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1nzi8X0zqcYO0FHHEdUbkBt8Xyah-Y2xl/view?usp=drive_link") },
        "RAFT-0321": { code: "RAFT-0321", desc: "R3PBL - Rafter 3P Bottom Light (Mono 540)", size: "125x55x15 mm", thick: "1.5 mm", length: "3200 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1kaO9houqrNp9sBy7nAykWwNfH6dQZKoC/view?usp=drive_link") },
        "RAFT-0322": { code: "RAFT-0322", desc: "R3PBM - Rafter 3P Bottom Medium (Mono 540)", size: "130x55x15 mm", thick: "2.0 mm", length: "3200 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1QR-FRZrIQIBe8G0KkCEmRzih6IR5g1Zl/view?usp=drive_link") },
        "RAFT-0323": { code: "RAFT-0323", desc: "R3PBH - Rafter 3P Bottom Heavy (Mono 540)", size: "180x55x15 mm", thick: "2.0 mm", length: "3200 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1L6h9jpP8ykRjq6Qrdw93yO6U9YhYFDx4/view?usp=drive_link") },
        "RAFT-1202": { code: "RAFT-1202", desc: "Rafter 2P Medium Gen 2 (Topcon 610)", size: "100x45x15 mm", thick: "1.5 mm", length: "4014 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/18F2_tPnxAT_cZHPkJG0ZED9W0dt2V4nX/view?usp=drive_link") },
        "RAFT-1203": { code: "RAFT-1203", desc: "Rafter 2P Heavy Gen 2 (Topcon 610)", size: "130x45x15 mm", thick: "1.5 mm", length: "4014 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1vVzPharqtFXenhi5cRSwAJnbhccMSQPC/view?usp=drive_link") },
        "RAFT-1204": { code: "RAFT-1204", desc: "Rafter 2P Super Heavy Gen 2 (Topcon 610)", size: "160x45x15 mm", thick: "1.5 mm", length: "4014 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1gpaDB-3CKpJvYcpOAEHd3eTZE8BXURbv/view?usp=drive_link") },
        "RAFT-1312": { code: "RAFT-1312", desc: "Rafter 3P Top Medium Gen 2 (Topcon 610)", size: "130x55x15 mm", thick: "1.5 / 2.0 mm", length: "3104 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1G9y9vX3ndzabjqJu77bWn9AfeUk2S_rw/view?usp=drive_link") },
        "RAFT-1313": { code: "RAFT-1313", desc: "Rafter 3P Top Heavy Gen 2 (Topcon 610)", size: "180x55x15 mm", thick: "1.5 / 2.0 mm", length: "3104 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1iTlBrkyIb4dEt2DaauAUU83PiI4dmpvr/view?usp=drive_link") },
        "RAFT-1322": { code: "RAFT-1322", desc: "Rafter 3P Bottom Medium Gen 2 (Topcon 610)", size: "130x55x15 mm", thick: "1.5 / 2.0 mm", length: "3304 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1iTlBrkyIb4dEt2DaauAUU83PiI4dmpvr/view?usp=drive_link") },
        "RAFT-1323": { code: "RAFT-1323", desc: "Rafter 3P Bottom Heavy Gen 2 (Topcon 610)", size: "180x55x15 mm", thick: "1.5 / 2.0 mm", length: "3304 mm", pdf: getDrivePreviewUrl("https://drive.google.com/file/d/1cEGfo466Lkitm4XrzUl0UgF5377q52F9/view?usp=drive_link") }
    };

    function showSuggestions() {
        let inputVal = document.getElementById("codeInput").value.trim().toUpperCase();
        let listContainer = document.getElementById("suggestionsList");
        listContainer.innerHTML = "";

        if (!inputVal) return;

        let matches = [];
        let searchKey = (!inputVal.includes("RAFT") && !isNaN(inputVal)) ? "RAFT-" + inputVal : inputVal;

        for (let key in raftersDB) {
            if (key.includes(searchKey) || raftersDB[key].desc.toUpperCase().includes(inputVal)) {
                matches.push(raftersDB[key]);
            }
        }

        if (matches.length > 0) {
            matches.forEach(item => {
                let div = document.createElement("div");
                div.className = "suggestion-item";
                div.innerHTML = `<strong>${item.code}</strong> - ${item.desc}`;
                div.onclick = function() {
                    document.getElementById("codeInput").value = item.code;
                    listContainer.innerHTML = "";
                    displayItem(item.code);
                };
                listContainer.appendChild(div);
            });
        }
    }

    function handleSearchEnter(event) {
        if (event.key === "Enter") {
            let query = document.getElementById("codeInput").value.trim().toUpperCase();
            document.getElementById("suggestionsList").innerHTML = "";

            if (!query.includes("RAFT") && !isNaN(query)) {
                query = "RAFT-" + query;
            }

            if (raftersDB[query]) {
                displayItem(query);
            } else {
                // Agar exact match nahi mila toh pehla matching item utha lo
                let foundKey = Object.keys(raftersDB).find(k => k.includes(query));
                if (foundKey) {
                    displayItem(foundKey);
                } else {
                    document.getElementById("resultSection").style.display = "none";
                    document.getElementById("errorMsg").style.display = "block";
                }
            }
        }
    }

    function displayItem(code) {
        const item = raftersDB[code];
        const resultSec = document.getElementById("resultSection");
        const errorMsg = document.getElementById("errorMsg");

        if (item) {
            errorMsg.style.display = "none";
            document.getElementById("resCode").innerText = item.code;
            document.getElementById("resTitle").innerText = item.desc;
            document.getElementById("resLength").innerText = item.length;
            document.getElementById("resThick").innerText = item.thick;
            document.getElementById("resSize").innerText = item.size;
            document.getElementById("pdfFrame").src = item.pdf || "";
            resultSec.style.display = "block";
        }
    }

    // Hide suggestions when clicking outside
    document.addEventListener("click", function(e) {
        if (!e.target.closest(".search-container")) {
            document.getElementById("suggestionsList").innerHTML = "";
        }
    });
</script>

</body>
</html>
