<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarSquare Rafter Finder</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0056b3; margin-bottom: 25px; }
        .search-container { display: flex; justify-content: center; margin-bottom: 20px; }
        .search-container input { width: 70%; padding: 12px 18px; font-size: 18px; border: 2px solid #0056b3; border-radius: 6px; outline: none; text-transform: uppercase; }
        .result-section { display: none; margin-top: 20px; }
        .details-card { background: #eef2f7; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; border-left: 5px solid #0056b3; }
        .details-card h3 { margin-top: 0; color: #0056b3; }
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; font-size: 16px; }
        .pdf-viewer-container { width: 100%; height: 550px; border: 1px solid #ccc; border-radius: 6px; background: #eee; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 6px; }
        .error-msg { color: red; text-align: center; font-weight: bold; margin-top: 15px; display: none; }
        @media(max-width: 600px) { .details-grid { grid-template-columns: 100%; } .search-container input { width: 100%; } }
    </style>
</head>
<body>

<div class="container">
    <h2>🔍 SolarSquare Rafter Quick Finder</h2>
    
    <div class="search-container">
        <input type="text" id="codeInput" placeholder="Enter Item Code or Number (e.g. 0101) & Press Enter..." onkeypress="handleSearch(event)">
    </div>
    
    <div id="errorMsg" class="error-msg">Item Code not found in database! Please check and try again.</div>

    <div id="resultSection" class="result-section">
        <div class="details-card">
            <h3 id="resTitle"></h3>
            <div class="details-grid">
                <div><strong>Item Code:</strong> <span id="resCode"></span></div>
                <div><strong>Length:</strong> <span id="resLength"></span></div>
                <div><strong>Thickness:</strong> <span id="resThick"></span></div>
                <div><strong>Section Size:</strong> <span id="resSize"></span></div>
            </div>
        </div>

        <h3>📄 Drawing PDF Preview</h3>
        <div class="pdf-viewer-container">
            <iframe id="pdfFrame" src=""></iframe>
        </div>
    </div>
</div>

<script>
            let query = document.getElementById("codeInput").value.trim().toUpperCase();
            const resultSec = document.getElementById("resultSection");
            const errorMsg = document.getElementById("errorMsg");

            let matchedItem = null;

            if (query) {
                if (!query.includes("RAFT")) {
                    query = "RAFT-" + query;
                }

                for (let key in raftersDB) {
                    if (key === query || key.includes(query)) {
                        matchedItem = raftersDB[key];
                        break;
                    }
                }
            }

            if (matchedItem) {
                errorMsg.style.display = "none";
                document.getElementById("resCode").innerText = matchedItem.code;
                document.getElementById("resTitle").innerText = matchedItem.desc;
                document.getElementById("resLength").innerText = matchedItem.length;
                document.getElementById("resThick").innerText = matchedItem.thick;
                document.getElementById("resSize").innerText = matchedItem.size;
                document.getElementById("pdfFrame").src = matchedItem.pdf || "";
                resultSec.style.display = "block";
            } else {
                resultSec.style.display = "none";
                errorMsg.style.display = "block";
            }
        }
    }
</script>

</body>
</html>
