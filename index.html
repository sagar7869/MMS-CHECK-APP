<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafter & Column Master Data Search</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            --card-bg: #ffffff;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .header-card { background: var(--primary-gradient); color: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); text-align: center; margin-bottom: 20px; }
        .header-card h2 { margin: 0 0 5px 0; font-size: 22px; }
        .header-card p { margin: 0; opacity: 0.85; font-size: 12px; }

        .search-card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 20px; border: 1px solid var(--border-color); }
        .row { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .group { flex: 1; min-width: 220px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
        select, input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; background: #f8fafc; }
        select:focus, input:focus { border-color: #3b82f6; outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        button:hover { background: #2563eb; }

        .section-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; margin-bottom: 20px; }
        
        .category-card { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border-color); box-shadow: 0 2px 6px rgba(0,0,0,0.02); overflow: hidden; }
        .cat-header { background: #f1f5f9; padding: 10px 15px; font-weight: 700; font-size: 13px; color: #334155; border-bottom: 1px solid var(--border-color); text-transform: uppercase; }
        .cat-body { padding: 12px 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .data-item { display: flex; flex-direction: column; }
        .data-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
        .data-val { font-size: 14px; color: var(--text-main); font-weight: 700; margin-top: 2px; }

        .expand-section { margin-bottom: 20px; }
        .expand-btn { background: #e2e8f0; color: #334155; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; font-size: 13px; }
        .expand-btn:hover { background: #cbd5e1; }
        .all-specs-box { display: none; background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

        /* Fast & Optimized PDF Frame */
        .pdf-card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border-color); margin-top: 20px; display: none; }
        .pdf-frame-container { position: relative; width: 100%; height: 450px; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: #e2e8f0; }
        iframe { width: 100%; height: 100%; border: none; }

        .msg { text-align: center; padding: 30px; font-weight: 600; color: var(--text-muted); background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); }
        .error { color: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <h2>Rafter & Column Master Data Portal</h2>
            <p>Fast Search by Number (e.g. 2811, 1620) & Instant Preview</p>
        </div>

        <div class="search-card">
            <div class="row">
                <div class="group">
                    <label>Select Category / Tab</label>
                    <select id="sheetSelect" onchange="onCategoryChange()">
                        <option value="Sheet1">Sheet1 (Rafters)</option>
                        <option value="Columns">Columns</option>
                    </select>
                </div>
                <div class="group">
                    <label>Enter Item Code / Number</label>
                    <input type="text" id="searchQuery" placeholder="e.g. 2811 or 1620">
                </div>
                <div class="group" style="flex: 0;">
                    <button id="searchBtn">Search</button>
                </div>
            </div>
        </div>

        <div id="resultsWrapper" style="display: none;">
            <div class="section-title">📌 Core Specifications</div>
            <div id="categoryGrid" class="category-grid"></div>

            <div class="expand-section">
                <button class="expand-btn" id="toggleExpandBtn" onclick="toggleAllSpecs()">▼ View All Detailed Specifications</button>
                <div id="allSpecsBox" class="all-specs-box"></div>
            </div>
        </div>

        <div class="pdf-card" id="pdfCard">
            <div class="section-title">📄 Fast Engineering Drawing Preview</div>
            <div class="pdf-frame-container">
                <iframe id="pdfFrame" src="" loading="lazy"></iframe>
            </div>
        </div>

        <div id="msgBox" class="msg">Please select a category and enter an item number to search.</div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxjnM58NxITtap_ewWL_RzJomDv4L78x4X9iI5j55XRmyDqYaH4QcVh66uPZAnkviopdw/exec";

        // Category change par input box automatic blank ho jayega
        function onCategoryChange() {
            document.getElementById('searchQuery').value = '';
            document.getElementById('resultsWrapper').style.display = 'none';
            document.getElementById('pdfCard').style.display = 'none';
            document.getElementById('msgBox').style.display = 'block';
            document.getElementById('msgBox').innerHTML = 'Category changed. Please enter item code/number.';
        }

        document.getElementById('searchBtn').addEventListener('click', runSearch);
        document.getElementById('searchQuery').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { runSearch(); }
        });

        function runSearch() {
            var sheetName = document.getElementById('sheetSelect').value;
            var query = document.getElementById('searchQuery').value.trim();
            var msgBox = document.getElementById('msgBox');
            var resultsWrapper = document.getElementById('resultsWrapper');
            var pdfCard = document.getElementById('pdfCard');
            
            if(!query) {
                alert('Please enter a search code or number!');
                return;
            }

            msgBox.style.display = 'block';
            msgBox.innerHTML = 'Searching fast...';
            resultsWrapper.style.display = 'none';
            pdfCard.style.display = 'none';

            var url = WEB_APP_URL + "?action=search&sheet=" + encodeURIComponent(sheetName) + "&query=" + encodeURIComponent(query);

            fetch(url)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (!data || data.length <= 1) {
                        msgBox.innerHTML = '<span class="error">No matching record found for "' + query + '"!</span>';
                        return;
                    }

                    msgBox.style.display = 'none';
                    resultsWrapper.style.display = 'block';

                    var headers = data[0]; 
                    var row = data[1];     
                    
                    var dataMap = {};
                    for (var i = 0; i < headers.length; i++) {
                        dataMap[headers[i].toString().trim().toLowerCase()] = row[i] !== undefined ? row[i] : '-';
                    }

                    function getVal(keyKeywords) {
                        for (var key in dataMap) {
                            for (var k = 0; k < keyKeywords.length; k++) {
                                if (key.indexOf(keyKeywords[k]) !== -1) {
                                    return dataMap[key];
                                }
                            }
                        }
                        return '-';
                    }

                    // Top aur Bottom Cee values ko properly map kiya gaya hai
                    var topCeeVal = getVal(['top cee']);
                    var bottomCeeVal = getVal(['bottom cee']);

                    var catHtml = '';
                    catHtml += '<div class="category-card"><div class="cat-header">📏 Basic & Dimensions</div><div class="cat-body">';
                    catHtml += createDataBox('Item Code', getVal(['item code']));
                    catHtml += createDataBox('Length', getVal(['length']));
                    catHtml += createDataBox('Thickness', getVal(['thickness']));
                    catHtml += createDataBox('Section Size', getVal(['section size']));
                    catHtml += '</div></div>';

                    catHtml += '<div class="category-card"><div class="cat-header">🔲 Cee Section Info</div><div class="cat-body">';
                    catHtml += createDataBox('Top Cee Size', topCeeVal);
                    catHtml += createDataBox('Bottom Cee Size', bottomCeeVal);
                    catHtml += '</div></div>';

                    catHtml += '<div class="category-card"><div class="cat-header">🧱 Rib & Base Plate</div><div class="cat-body">';
                    catHtml += createDataBox('Rib Size', getVal(['rib size']));
                    catHtml += createDataBox('Rib Thickness', getVal(['rib thickness']));
                    catHtml += createDataBox('Base Plate Size', getVal(['base plate size']));
                    catHtml += createDataBox('Plate Thickness', getVal(['base plate thickness']));
                    catHtml += '</div></div>';

                    document.getElementById('categoryGrid').innerHTML = catHtml;

                    var allHtml = '';
                    for (var j = 0; j < headers.length; j++) {
                        var h = headers[j];
                        var v = row[j] !== undefined ? row[j] : '-';
                        if (h.toLowerCase().indexOf('pdf') === -1) {
                            allHtml += '<div class="data-item"><span class="data-label">' + h + '</span><span class="data-val">' + (v !== '' ? v : '-') + '</span></div>';
                        }
                    }
                    document.getElementById('allSpecsBox').innerHTML = allHtml;

                    fetchAndShowPdf(sheetName, 1);
                })
                .catch(function(err) {
                    msgBox.innerHTML = '<span class="error">Connection Error: ' + err.message + '</span>';
                });
        }

        function createDataBox(label, val) {
            return '<div class="data-item"><span class="data-label">' + label + '</span><span class="data-val">' + (val !== '' ? val : '-') + '</span></div>';
        }

        function toggleAllSpecs() {
            var box = document.getElementById('allSpecsBox');
            var btn = document.getElementById('toggleExpandBtn');
            if (box.style.display === 'grid') {
                box.style.display = 'none';
                btn.innerHTML = '▼ View All Detailed Specifications';
            } else {
                box.style.display = 'grid';
                btn.innerHTML = '▲ Hide Detailed Specifications';
            }
        }

        function fetchAndShowPdf(sheetName, rowIndex) {
            var url = WEB_APP_URL + "?action=pdf&sheet=" + encodeURIComponent(sheetName) + "&row=" + rowIndex;
            
            fetch(url)
                .then(function(response) { return response.json(); })
                .then(function(res) {
                    if (res && res.pdfUrl) {
                        var pdfCard = document.getElementById('pdfCard');
                        var pdfFrame = document.getElementById('pdfFrame');
                        
                        var embedUrl = res.pdfUrl;
                        if (embedUrl.indexOf('drive.google.com') !== -1) {
                            embedUrl = embedUrl.replace('/view?usp=drivesdk', '/preview').replace('/view', '/preview');
                        }
                        
                        pdfFrame.src = embedUrl;
                        pdfCard.style.display = 'block';
                    }
                })
                .catch(function(err) {
                    console.error('Error loading PDF: ' + err.message);
                });
        }
    </script>
</body>
</html>
