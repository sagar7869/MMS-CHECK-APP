<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafter & Column Master Data Search</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; padding: 20px; color: #333; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .row { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .group { flex: 1; min-width: 220px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1557b0; }
        .table-responsive { width: 100%; overflow-x: auto; max-height: 500px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; white-space: nowrap; }
        th { background: #f1f3f4; position: sticky; top: 0; z-index: 1; }
        .btn-pdf { background: #d93025; color: white; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .btn-pdf:hover { background: #b31412; }
        .msg { text-align: center; padding: 20px; font-weight: bold; color: #666; }
        .error { color: #d93025; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" style="text-align: center;">
            <h2>Rafter & Column Master Data Search</h2>
            <p>Search by Item Code (e.g. RAFT-0101 or COLU-1620) across Sheets and open PDFs</p>
        </div>

        <div class="card">
            <div class="row">
                <div class="group">
                    <label>Select Category / Tab:</label>
                    <select id="sheetSelect">
                        <option value="Sheet1">Sheet1 (Rafters)</option>
                        <option value="Columns">Columns</option>
                    </select>
                </div>
                <div class="group">
                    <label>Enter Item Code:</label>
                    <input type="text" id="searchQuery" placeholder="e.g. COLU-1620 or RAFT-0101" onkeydown="if(event.key === 'Enter') runSearch()">
                </div>
                <div class="group" style="flex: 0;">
                    <button onclick="runSearch()">Search Item</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Search Results</h3>
            <div id="resultBox" class="table-responsive">
                <div class="msg">Please select category and enter an Item Code to search.</div>
            </div>
        </div>
    </div>

    <script>
        // Yahan apna Google Apps Script ka deployed Web App URL paste karein
        const WEB_APP_URL = "APNA_GOOGLE_APPS_SCRIPT_WEB_APP_URL_YAHAN_DALO";

        function runSearch() {
            var sheetName = document.getElementById('sheetSelect').value;
            var query = document.getElementById('searchQuery').value.trim();
            var box = document.getElementById('resultBox');
            
            box.innerHTML = '<div class="msg">Searching database...</div>';

            var url = WEB_APP_URL + "?action=search&sheet=" + encodeURIComponent(sheetName) + "&query=" + encodeURIComponent(query);

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (!data || data.length <= 1) {
                        box.innerHTML = '<div class="msg error">No matching record found!</div>';
                        return;
                    }

                    var html = '<table><thead><tr>';
                    var headers = data[0];
                    for (var i = 0; i < headers.length; i++) {
                        html += '<th>' + headers[i] + '</th>';
                    }
                    html += '<th>PDF Action</th></tr></thead><tbody>';

                    for (var r = 1; r < data.length; r++) {
                        html += '<tr>';
                        var row = data[r];
                        for (var c = 0; c < row.length; c++) {
                            html += '<td>' + (row[c] !== undefined ? row[c] : '') + '</td>';
                        }
                        html += '<td><button class="btn-pdf" onclick="openPdf(\'' + sheetName + '\', ' + r + ')">Open PDF</button></td>';
                        html += '</tr>';
                    }
                    html += '</tbody></table>';
                    box.innerHTML = html;
                })
                .catch(err => {
                    box.innerHTML = '<div class="msg error">Connection Error: ' + err.message + '</div>';
                });
        }

        function openPdf(sheetName, rowIndex) {
            var url = WEB_APP_URL + "?action=pdf&sheet=" + encodeURIComponent(sheetName) + "&row=" + rowIndex;
            
            fetch(url)
                .then(response => response.json())
                .then(res => {
                    if (res && res.pdfUrl) {
                        window.open(res.pdfUrl, '_blank');
                    } else {
                        alert('No PDF file found for this item in Drive or Sheet.');
                    }
                })
                .catch(err => {
                    alert('Error fetching PDF: ' + err.message);
                });
        }
    </script>
</body>
</html>
