<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafter & Column Master Data Search</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; padding: 20px; color: #333; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .row { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; }
        .group { flex: 1; min-width: 220px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1557b0; }
        
        /* Specifications Layout */
        .spec-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
        .spec-item { background: #f1f3f4; padding: 12px 15px; border-radius: 6px; border-left: 4px solid #1a73e8; }
        .spec-title { font-size: 12px; color: #5f6368; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .spec-value { font-size: 15px; color: #202124; font-weight: 600; word-break: break-all; }
        
        /* Direct PDF Viewer Frame */
        .pdf-viewer-section { margin-top: 25px; }
        .pdf-viewer-section h3 { margin-bottom: 10px; color: #1a73e8; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
        
        .msg { text-align: center; padding: 20px; font-weight: bold; color: #666; }
        .error { color: #d93025; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" style="text-align: center;">
            <h2>Rafter & Column Master Data Search</h2>
            <p>Search by Item Code to view Specifications and Direct PDF Preview</p>
        </div>

        <div class="card">
            <div class="row">
                <div class="group">
                    <label>Select Category / Tab:</label>
                    <select id="sheetSelect">
                        <option value="Sheet1">Sheet1 (Rafters)</option>
                        <option value="Columns">Columns</option>
                    </select>
                </div>
                <div class="group">
                    <label>Enter Item Code:</label>
                    <input type="text" id="searchQuery" placeholder="e.g. COLU-1620 or RAFT-0101">
                </div>
                <div class="group" style="flex: 0;">
                    <button id="searchBtn">Search Item</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Item Specifications</h3>
            <div id="resultBox">
                <div class="msg">Please select category and enter an Item Code to search.</div>
            </div>
        </div>

        <!-- Direct PDF Viewer Card -->
        <div class="card" id="pdfCard" style="display: none;">
            <div class="pdf-viewer-section">
                <h3>Engineering Drawing Preview (PDF)</h3>
                <iframe id="pdfFrame" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxjnM58NxITtap_ewWL_RzJomDv4L78x4X9iI5j55XRmyDqYaH4QcVh66uPZAnkviopdw/exec";

        document.getElementById('searchBtn').addEventListener('click', runSearch);
        document.getElementById('searchQuery').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { runSearch(); }
        });

        function runSearch() {
            var sheetName = document.getElementById('sheetSelect').value;
            var query = document.getElementById('searchQuery').value.trim();
            var box = document.getElementById('resultBox');
            var pdfCard = document.getElementById('pdfCard');
            
            box.innerHTML = '<div class="msg">Searching database...</div>';
            pdfCard.style.display = 'none';

            var url = WEB_APP_URL + "?action=search&sheet=" + encodeURIComponent(sheetName) + "&query=" + encodeURIComponent(query);

            fetch(url)
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (!data || data.length <= 1) {
                        box.innerHTML = '<div class="msg error">No matching record found!</div>';
                        return;
                    }

                    var headers = data[0]; 
                    var row = data[1];     

                    var html = '<div class="spec-container">';
                    for (var i = 0; i < headers.length; i++) {
                        var hName = headers[i];
                        var val = row[i] !== undefined ? row[i] : '';
                        
                        if (hName.toLowerCase().indexOf('pdf') === -1) {
                            html += '<div class="spec-item">';
                            html += '<div class="spec-title">' + hName + '</div>';
                            html += '<div class="spec-value">' + (val !== '' ? val : '-') + '</div>';
                            html += '</div>';
                        }
                    }
                    html += '</div>';
                    box.innerHTML = html;

                    // Automatically fetch and show PDF in preview frame
                    fetchPdfUrl(sheetName, 1);
                })
                .catch(function(err) {
                    box.innerHTML = '<div class="msg error">Connection Error: ' + err.message + '</div>';
                });
        }

        function fetchPdfUrl(sheetName, rowIndex) {
            var url = WEB_APP_URL + "?action=pdf&sheet=" + encodeURIComponent(sheetName) + "&row=" + rowIndex;
            
            fetch(url)
                .then(function(response) { return response.json(); })
                .then(function(res) {
                    if (res && res.pdfUrl) {
                        var pdfCard = document.getElementById('pdfCard');
                        var pdfFrame = document.getElementById('pdfFrame');
                        
                        // Convert Google Drive view link to embed preview format if needed
                        var embedUrl = res.pdfUrl;
                        if (embedUrl.indexOf('view') !== -1) {
                            embedUrl = embedUrl.replace('/view?usp=drivesdk', '/preview').replace('/view', '/preview');
                        }
                        
                        pdfFrame.src = embedUrl;
                        pdfCard.style.display = 'block';
                    }
                })
                .catch(function(err) {
                    console.error('Error fetching PDF preview: ' + err.message);
                });
        }
    </script>
</body>
</html>
